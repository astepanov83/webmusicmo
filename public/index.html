<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0b0e">
  <title>Metal Only</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <main class="player" id="player">
    <div class="panel panel-left">
    <header class="top">
      <div class="station">
        <span class="station-dot" id="statusDot" aria-hidden="true"></span>
        <div>
          <div class="station-name" id="stationName">Metal Only</div>
          <div class="station-status" id="statusText">Stopped</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="vizToggle" title="Toggle visualizer (v)" aria-pressed="true">
          <svg viewBox="0 0 24 24"><path d="M4 14v6M9 8v12M14 4v16M19 11v9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
        </button>
        <button class="icon-btn" id="themeToggle" title="Theme: dark (t)">
          <svg class="ic-moon" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
          <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="ic-auto" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M8 20h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <section class="stage">
      <canvas id="viz" class="viz" aria-hidden="true"></canvas>
      <button class="play" id="playBtn" aria-label="Play">
        <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
        <svg class="ic-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </section>

    <section class="now" aria-live="polite">
      <div class="song" id="song">Press play</div>
      <div class="artist" id="artist">&nbsp;</div>
      <div class="show" id="show"></div>
    </section>

    <section class="controls">
      <div class="volume">
        <button class="icon-btn" id="muteBtn" title="Mute (m)" aria-pressed="false">
          <svg class="ic-vol" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 8.5a4.5 4.5 0 0 1 0 7M18.2 5.8a8 8 0 0 1 0 12.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          <svg class="ic-muted" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <input type="range" id="volume" min="0" max="100" value="80" aria-label="Volume">
      </div>
      <div class="selects">
        <label class="select">
          <span>Quality</span>
          <select id="quality"><option>Loading</option></select>
        </label>
        <label class="select">
          <span>Sleep</span>
          <select id="sleep">
            <option value="0">Off</option>
            <option value="15">15 min</option>
            <option value="30">30 min</option>
            <option value="45">45 min</option>
            <option value="60">1 h</option>
            <option value="90">1.5 h</option>
            <option value="120">2 h</option>
          </select>
        </label>
      </div>
    </section>

    <section class="meta">
      <span id="elapsed" title="Time listening"></span>
      <span id="bitrate"></span>
      <span id="listeners" title="Listeners right now"></span>
      <span id="sleepLeft"></span>
    </section>


    <footer class="foot">
      <a id="stationLink" href="https://www.metal-only.de" target="_blank" rel="noopener">metal-only.de</a>
      <a id="plsLink" href="#" target="_blank" rel="noopener" title="Open in an external player">PLS</a>
      <button class="text-btn" id="copyUrl" title="Copy the stream URL">Copy stream URL</button>
      <span class="keys" title="Keyboard: Space play/stop, M mute, arrows volume, T theme, V visualizer">keys</span>
    </footer>
    </div>

    <aside class="panel panel-right">
    <section class="history">
      <div class="history-head">
        <h2>Recently played</h2>
        <button class="text-btn" id="clearHistory">Clear</button>
      </div>
      <ol id="historyList" class="history-list"></ol>
      <div class="history-empty" id="historyEmpty">Tracks will appear here as they play.</div>
    </section>
    </aside>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
